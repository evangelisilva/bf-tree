# ===== INSERT KEY SIZE SWEEP =====
# Configuration: 5 key sizes (8, 16, 32, 64, 128 bytes), 8-byte values, 32MB cache
# Benchmark: Insert 1M records with uniform distribution

[[BfTreeBench]]
name = "insert_key_size_sweep_8"
threads = [1]
time = 0
repeat = 1
record_cnt = 1_000_000
distribution = [{ Uniform = {} }]
workload_mix = [
	{ read = 0, negative_read = 0, update = 0, scan = 0, insert = 100 },
]
key_len = 8
scan_cnt = 1
memory_size_mb = [32]
file_path = ":memory:"
storage = ["Memory"]
read_promotion_rate = [100]
copy_on_access_ratio = [0.1]
record_count_mode = true
value_len = 8
warmup_cnt = 0
preload_records = 0

