# ===== LOOKUP BENCHMARKS =====
# Configuration: 5 key sizes (8, 16, 32, 64, 128 bytes), 128-byte values, 32MB cache
# Benchmark: Lookup 10K operations with Zipfian(1.0) - skewed distribution
# Warmup: 10K operations before each benchmark

# ===== 8-byte keys - Lookup Benchmark =====
[[BfTreeBench]]
name = "lookup_8byte"
threads = [1]
time = 0
repeat = 1
record_cnt = 10_000
distribution = [{ Zipf = 1.0 }]
workload_mix = [
	{ read = 100, negative_read = 0, update = 0, scan = 0, insert = 0 },
]
key_len = 8
scan_cnt = 1
memory_size_mb = [32]
file_path = ":memory:"
storage = ["Memory"]
read_promotion_rate = [100]
copy_on_access_ratio = [0.1]
record_count_mode = true
value_len = 128
warmup_cnt = 10_000
preload_records = 1_000_000

